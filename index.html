<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <script>
    // Mobilen i datorns upplösning (Carl 2026-09-29): en telefon i liggande läge lägger ut sidan som
    // en datorskärm (~1280 px bred) och skalar ner allt lika mycket – menyerna, figurskaparen och
    // spelbilden ser ut precis som på datorn. Stående: vanlig bredd (spelet ber en vända mobilen).
    // Bredden väljs så att varje CSS-pixel blir ett HELT antal skärmpixlar (iPhone 13 mini: 2436
    // skärmpixlar / 2 = 1218, iPhone 13: 1266) – då blir pixelmenyerna och spelbilden knivskarpa.
    // devicePixelRatio rättas till enhetspixlar per CSS-pixel efter nedskalningen – Chromium räknar
    // inte in den, WebKit (iPhone) gör det redan.
    (function () {
      var m = document.querySelector('meta[name=viewport]');
      if (!m) return;
      var base = window.devicePixelRatio || 1;
      window.__baseDpr = base; // skärmens verkliga skala (main.js räknar telefonens spelskala på den fysiska skärmen)
      var phone = function () { return matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 700; };
      var landscape = function () { return screen.orientation && screen.orientation.type ? /landscape/.test(screen.orientation.type) : window.innerWidth > window.innerHeight; };
      var deskW = function () { var phys = Math.round(Math.max(screen.width, screen.height) * base), k = Math.max(1, Math.round(phys / 1280)); return Math.round(phys / k); };
      var set = function () {
        var desk = phone() && landscape();
        var want = desk ? 'width=' + deskW() + ', user-scalable=no, viewport-fit=cover' : 'width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover';
        if (m.getAttribute('content') !== want) m.setAttribute('content', want);
        document.documentElement.classList.toggle('desk-mobil', desk);
      };
      set();
      window.addEventListener('orientationchange', function () { setTimeout(set, 60); });
      window.addEventListener('resize', set);
      if (!phone()) return;
      try {
        var d = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio');
        if (d && d.get && d.configurable) Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: function () {
          var real = d.get.call(window), vv = (window.visualViewport && window.visualViewport.scale) || 1;
          return Math.min(real, base * vv);
        } });
      } catch (e) { /* gamla webbläsare: som förut */ }
    })();
  </script>
  <script>
    // Pixeltypsnittet (Pixelstad, css/style.css): --f1..--f4 = 1–4 skärmpixlar per bokstavspixel ≈ 12/24/36/48 px,
    // avrundat så att en bokstavspixel blir HELA skärmpixlar vid den här skalan (Windows 125 %, iPhone …).
    // Körs efter skriptet ovan (då är mobilens devicePixelRatio redan rättad).
    (function () {
      var fonts = function () {
        var d = window.devicePixelRatio || 1, st = document.documentElement.style;
        for (var k = 1; k <= 4; k++) st.setProperty('--f' + k, (12 * Math.max(1, Math.round(k * d)) / d) + 'px');
      };
      fonts();
      window.addEventListener('resize', fonts);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', fonts);
    })();
  </script>
  <title>Snabbfilen</title>
  <meta name="description" content="Livet i Pixelstaden: jobba, käka, klä dig snyggt och spara till drömhuset.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
</head>
<body>
  <div id="hud">
    <span id="hud-face"></span>
    <span id="hud-name"></span>
    <span id="hud-day"></span>
    <span id="hud-clock"></span>
    <span id="hud-money"></span>
    <span class="meter" title="Mätthet">🍔<span class="bar"><i id="bar-hunger"></i></span></span>
    <span class="meter" title="Energi">⚡<span class="bar"><i id="bar-energy"></i></span></span>
    <span class="meter" title="Lycka">😊<span class="bar"><i id="bar-lycka"></i></span></span>
    <span class="hud-btns">
      <button id="hud-friends" class="btn btn-small" title="Vilka är online? Åk och hälsa på!">👥</button>
      <button id="hud-diary" class="btn btn-small" title="Din resa – vad du har gjort">📊</button>
      <button id="hud-mute" class="btn btn-small" title="Ljud av/på">🔊</button>
    </span>
  </div>
  <div id="app"><canvas id="scene" width="768" height="432"></canvas></div>
  <button id="decor-btn" class="btn btn-small hidden" title="Möblera ditt hem">🛋️ Möblera</button>
  <div id="decor-panel" class="hidden">
    <div class="dp-head">📦 Förrådet</div>
    <div id="decor-storage"></div>
    <div class="dp-foot">
      <button id="decor-paint" class="btn btn-small btn-gold" disabled title="Välj en möbel först">🎨 Färg</button>
      <button id="decor-rotate" class="btn btn-small" disabled title="Vrid möbeln du håller i (tangent R)">🔄 Rotera</button>
      <button id="decor-store" class="btn btn-small" disabled title="Lägg möbeln i förrådet – så kan den flytta till ett annat rum">📦 Förråd</button>
      <button id="decor-sell" class="btn btn-small btn-red" disabled>Sälj</button>
      <button id="decor-done" class="btn btn-small btn-go">Klar</button>
    </div>
  </div>
  <div id="emotes" class="hidden">
    <button class="btn btn-small" data-e="👋">👋</button>
    <button class="btn btn-small" data-e="❤️">❤️</button>
    <button class="btn btn-small" data-e="😂">😂</button>
    <button class="btn btn-small" data-e="🎉">🎉</button>
  </div>
  <!-- Vänd på mobilen: visas i stående läge på små pekskärmar (rotateHint i main.js) -->
  <div id="rotate" class="hidden">
    <div class="rot-box">
      <div class="rot-phone"></div>
      <b>Vänd på mobilen!</b>
      <p>Snabbfilen spelas liggande – då fylls hela skärmen med Pixelstaden.</p>
      <button id="rotate-anyway" class="btn btn-small">Spela stående ändå</button>
    </div>
  </div>
  <div id="modal" class="hidden"></div>
  <div id="toasts"></div>
  <!-- version-ui före main: kopierar sparningen innan en ny version läser den -->
  <script type="module" src="js/core/i18n-html.js"></script>
  <script type="module" src="js/core/version-ui.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
