<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Snabbfilen</title>
  <meta name="description" content="Livet i Pixelstaden: jobba, käka, klä dig snyggt och spara till drömhuset.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
</head>
<body>
  <div id="hud">
    <span id="hud-face"></span>
    <span id="hud-name"></span>
    <span id="hud-day"></span>
    <span id="hud-clock"></span>
    <span id="hud-money"></span>
    <span class="meter" title="Mätthet">🍔<span class="bar"><i id="bar-hunger"></i></span></span>
    <span class="meter" title="Energi">⚡<span class="bar"><i id="bar-energy"></i></span></span>
    <span class="hud-btns">
      <button id="hud-friends" class="btn btn-small" title="Vilka är online? Åk och hälsa på!">👥</button>
      <button id="hud-diary" class="btn btn-small" title="Din resa – vad du har gjort">📊</button>
      <button id="hud-mute" class="btn btn-small" title="Ljud av/på">🔊</button>
    </span>
  </div>
  <div id="app"><canvas id="scene" width="768" height="432"></canvas></div>
  <button id="decor-btn" class="btn btn-small hidden" title="Möblera ditt hem">🛋️ Möblera</button>
  <div id="decor-panel" class="hidden">
    <div class="dp-head">📦 Förrådet</div>
    <div id="decor-storage"></div>
    <div class="dp-foot">
      <button id="decor-paint" class="btn btn-small btn-gold" disabled title="Välj en möbel först">🎨 Färg</button>
      <button id="decor-rotate" class="btn btn-small" disabled title="Vrid möbeln du håller i (tangent R)">🔄 Rotera</button>
      <button id="decor-store" class="btn btn-small" disabled title="Lägg möbeln i förrådet – så kan den flytta till ett annat rum">📦 Förråd</button>
      <button id="decor-sell" class="btn btn-small btn-red" disabled>Sälj</button>
      <button id="decor-done" class="btn btn-small btn-go">Klar</button>
    </div>
  </div>
  <div id="emotes" class="hidden">
    <button class="btn btn-small" data-e="👋">👋</button>
    <button class="btn btn-small" data-e="❤️">❤️</button>
    <button class="btn btn-small" data-e="😂">😂</button>
    <button class="btn btn-small" data-e="🎉">🎉</button>
  </div>
  <!-- Vänd på mobilen: visas i stående läge på små pekskärmar (rotateHint i main.js) -->
  <div id="rotate" class="hidden">
    <div class="rot-box">
      <div class="rot-phone"></div>
      <b>Vänd på mobilen!</b>
      <p>Snabbfilen spelas liggande – då fylls hela skärmen med Pixelstaden.</p>
      <button id="rotate-anyway" class="btn btn-small">Spela stående ändå</button>
    </div>
  </div>
  <div id="modal" class="hidden"></div>
  <div id="toasts"></div>
  <!-- version-ui före main: kopierar sparningen innan en ny version läser den -->
  <script type="module" src="js/core/version-ui.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
